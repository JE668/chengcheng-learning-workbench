name: CI

# 类型安全守门：next.config.mjs 里为兼容 NAS 自托管构建设了
# typescript.ignoreBuildErrors / eslint.ignoreDuringBuilds，
# 因此构建不会因类型错误而失败——改由 CI 显式校验，避免「能构建但不能跑」的回归。
on:
  push:
    branches: [main]
  pull_request:
  # 供 build.yml 通过 `uses:` 复用调用；缺此项时 GitHub 会拒绝实例化
  # precheck job，导致整个 build run 0 jobs 直接失败。
  workflow_call:

# 本 workflow 被 build.yml 以 `uses:` 复用调用，因此 concurrency group 必须同时
# 区分「谁在调用」。关键点：
#   - github.event_name 在嵌套调用中继承父事件（仍为 "push"），无法区分来源，
#     用它会再次撞车。
#   - github.workflow 在嵌套调用中取调用方名字（"Build and Push Image"），可区分。
#   - 必须加 "CI-" 前缀：否则嵌套 run 的 group 会变成
#     "Build and Push Image-refs/heads/main"，与 build.yml 自身的 group 完全相同，
#     cancel-in-progress 会让 build.yml 与它自己的 precheck 互相取消。
#
# 最终三条线互不干扰：
#   CI push 独立运行      -> CI-CI-refs/heads/main
#   ci.yml 被 build 调用  -> CI-Build and Push Image-refs/heads/main
#   build.yml 自身        -> Build and Push Image-refs/heads/main
concurrency:
  group: CI-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 调试工作目录
        run: |
          pwd
          ls -la
          ls -la package.json pnpm-lock.yaml

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        name: Cache pnpm store
        id: pnpm-store-cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - uses: actions/cache@v4
        name: Cache node_modules
        id: node-modules-cache
        with:
          path: |
            **/node_modules
            .next/cache
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: TypeScript 类型检查（主代码库）
        run: npx tsc --noEmit --skipLibCheck -p tsconfig.json

      - name: 单元测试 + 覆盖率
        run: pnpm test:coverage

      - name: ESLint 代码检测
        run: pnpm lint

      - name: 生产构建冒烟（next build）
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: 性能预算检查
        run: |
          # 检查 JS bundle 大小不超过预算
          # 实际 First Load JS 约 87KB，但 .next/static/chunks 总计约 4MB（含动态导入）
          # 预算设为 5000KB 防止失控增长，同时允许正常的代码分割
          BUDGET_KB=5000
          ACTUAL_KB=$(find .next/static/chunks -name "*.js" -type f -exec wc -c {} + 2>/dev/null | awk '{sum+=$1} END {print int(sum/1024)}')
          echo "Total client chunks: ${ACTUAL_KB}KB (budget: ${BUDGET_KB}KB)"
          if [ "$ACTUAL_KB" -gt "$BUDGET_KB" ]; then
            echo "❌ Bundle size exceeds budget!"
            exit 1
          fi
          echo "✅ Bundle size within budget"

      - name: API 路由鉴权自动检查
        run: |
          ALLOWED_MISSING=(
            'auth/login'
            'auth/logout'
            'cron/backup'
            'cron/settle'
            'media/[...path]'
            'tts'
            'tts-edge'
            'tts-debug'
          )
          FAIL=0
          while IFS= read -r f; do
            rel="${f#src/app/api/}"
            rel="${rel%/route.ts}"
            skip=0
            for a in "${ALLOWED_MISSING[@]}"; do [ "$rel" = "$a" ] && { skip=1; break; }; done
            [ "$skip" = 1 ] && continue
            if ! grep -q 'getCurrentUser' "$f" 2>/dev/null; then
              echo "❌ 缺少鉴权: $rel"
              FAIL=1
            fi
          done < <(find src/app/api -name 'route.ts' | sort)
          if [ "$FAIL" = 1 ]; then echo "---"; echo "新增路由必须调用 getCurrentUser()；已知公开路由请加入 ALLOWED_MISSING 白名单。"; exit 1; fi
          echo "✅ 全部路由均已鉴权"

      - name: 依赖安全扫描
        run: |
          # 依赖安全门禁：阻断 high/critical 漏洞
          # 使用官方 registry（npmmirror 不支持 audit endpoint）
          pnpm audit --json --registry=https://registry.npmjs.org > audit-report.json || true

          # Next.js 14.x 分支的已知豁免：14.x 存在 8 个 high 级 advisory，
          # 补丁仅在 15.5.15~15.5.21 发布，14.x 没有任何可用修复版本。
          # 影响面评估：SSRF 类需攻击者控制 Host 头，项目以 `next start` 部署
          # （Host 由 next 自身固定）实际不可达；DoS 类需构造 RSC 序列化请求。
          # 升级到 Next.js 15 需同步 React 18→19，属独立任务另行评估。
          ACCEPTED_NEXT=$(cat audit-report.json | jq '[.advisories[] | select(.severity=="high" or .severity=="critical") | select(.module_name=="next")] | length')
          ACTIONABLE=$(cat audit-report.json | jq '[.advisories[] | select(.severity=="high" or .severity=="critical") | select(.module_name!="next")] | length')
          echo "high/critical 漏洞：待修复 $ACTIONABLE 个，next 已知豁免 $ACCEPTED_NEXT 个"

          if [ "$ACTIONABLE" -gt 0 ]; then
            echo "❌ Found $ACTIONABLE high/critical vulnerabilities (excl. accepted next advisories)"
            cat audit-report.json | jq '.advisories[] | select(.severity=="high" or .severity=="critical") | select(.module_name!="next") | {title: .title, severity: .severity, module: .module_name, url: .url}'
            exit 1
          else
            echo "✅ No actionable high/critical vulnerabilities"
          fi

      - name: 上传安全扫描报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: audit-report.json

  # E2E 测试（独立 job，可并行，失败不阻塞主流程）
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: 调试工作目录
        run: |
          pwd
          ls -la
          ls -la package.json pnpm-lock.yaml

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        name: Cache pnpm store
        id: pnpm-store-cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - uses: actions/cache@v4
        name: Cache node_modules
        id: node-modules-cache
        with:
          path: |
            **/node_modules
            .next/cache
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - uses: actions/cache@v4
        name: Cache Playwright browsers
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 初始化测试数据库（seed 默认账号，local.db 被 gitignore 未入库）
        run: pnpm seed

      - name: 安装 Playwright 浏览器（全部）
        run: pnpm exec playwright install --with-deps chromium

      - name: 启动开发服务器
        env:
          # e2e 有 23 次登录尝试，默认限流 5 分钟 10 次会导致后半段测试全部 429。
          # 测试环境放宽：1 小时 100 次（仅影响本测试 run 的 dev server 进程）。
          LOGIN_RATE_LIMIT_WINDOW: '3600'
          LOGIN_RATE_LIMIT_MAX: '100'
        run: |
          pnpm dev > dev.log 2>&1 &
          DEV_PID=$!
          echo "Dev server PID: $DEV_PID"
          # 等待并重试检查服务器是否就绪
          for i in {1..60}; do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Dev server ready after $i attempts"
              break
            fi
            if ! kill -0 $DEV_PID 2>/dev/null; then
              echo "Dev server process died!"
              cat dev.log
              exit 1
            fi
            sleep 2
          done
          # 最后确认
          curl -f http://localhost:3000 || (cat dev.log && exit 1)

      - name: 运行 E2E 测试（核心认证 + 业务流程 + 学习模块）
        run: pnpm e2e --project=chromium tests/e2e/auth.spec.ts tests/e2e/business-flows.spec.ts tests/e2e/study-modules.spec.ts --timeout=180000
        env:
          E2E_BASE_URL: http://localhost:3000

      - name: 上传 E2E 失败截图/视频
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/

  # 视觉回归测试（失败不阻塞，仅在本地生成基线）
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: 调试工作目录
        run: |
          pwd
          ls -la
          ls -la package.json pnpm-lock.yaml

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        name: Cache pnpm store
        id: pnpm-store-cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - uses: actions/cache@v4
        name: Cache node_modules
        id: node-modules-cache
        with:
          path: |
            **/node_modules
            .next/cache
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - uses: actions/cache@v4
        name: Cache Playwright browsers
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 初始化测试数据库（seed 默认账号，local.db 被 gitignore 未入库）
        run: pnpm seed

      - name: 安装 Playwright 浏览器（全部）
        run: pnpm exec playwright install --with-deps chromium

      - name: 启动开发服务器
        env:
          # e2e 有 23 次登录尝试，默认限流 5 分钟 10 次会导致后半段测试全部 429。
          # 测试环境放宽：1 小时 100 次（仅影响本测试 run 的 dev server 进程）。
          LOGIN_RATE_LIMIT_WINDOW: '3600'
          LOGIN_RATE_LIMIT_MAX: '100'
        run: |
          pnpm dev > dev.log 2>&1 &
          DEV_PID=$!
          echo "Dev server PID: $DEV_PID"
          # 等待并重试检查服务器是否就绪
          for i in {1..60}; do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Dev server ready after $i attempts"
              break
            fi
            if ! kill -0 $DEV_PID 2>/dev/null; then
              echo "Dev server process died!"
              cat dev.log
              exit 1
            fi
            sleep 2
          done
          # 最后确认
          curl -f http://localhost:3000 || (cat dev.log && exit 1)

      - name: 生成视觉基线（首次运行）
        run: pnpm e2e --project=chromium tests/e2e/visual.spec.ts --update-snapshots --timeout=120000
        env:
          E2E_BASE_URL: http://localhost:3000
        continue-on-error: true

      - name: 上传视觉差异报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: test-results/
