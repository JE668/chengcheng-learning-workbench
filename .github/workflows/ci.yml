name: CI

# 类型安全守门：next.config.mjs 里为兼容 NAS 自托管构建设了
# typescript.ignoreBuildErrors / eslint.ignoreDuringBuilds，
# 因此构建不会因类型错误而失败——改由 CI 显式校验，避免「能构建但不能跑」的回归。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 调试工作目录
        run: |
          pwd
          ls -la
          ls -la package.json pnpm-lock.yaml

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: pnpm install

      - name: TypeScript 类型检查（主代码库）
        run: npx tsc --noEmit --skipLibCheck -p tsconfig.json

      - name: 单元测试 + 覆盖率
        run: pnpm test:coverage

      - name: ESLint 代码检测
        run: pnpm lint

      - name: 生产构建冒烟（next build）
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: API 路由鉴权自动检查
        run: |
          ALLOWED_MISSING=(
            'auth/login'
            'auth/logout'
            'cron/backup'
            'cron/settle'
            'media/[...path]'
            'tts'
            'tts-edge'
            'tts-debug'
          )
          FAIL=0
          while IFS= read -r f; do
            rel="${f#src/app/api/}"
            rel="${rel%/route.ts}"
            skip=0
            for a in "${ALLOWED_MISSING[@]}"; do [ "$rel" = "$a" ] && { skip=1; break; }; done
            [ "$skip" = 1 ] && continue
            if ! grep -q 'getCurrentUser' "$f" 2>/dev/null; then
              echo "❌ 缺少鉴权: $rel"
              FAIL=1
            fi
          done < <(find src/app/api -name 'route.ts' | sort)
          if [ "$FAIL" = 1 ]; then echo "---"; echo "新增路由必须调用 getCurrentUser()；已知公开路由请加入 ALLOWED_MISSING 白名单。"; exit 1; fi
          echo "✅ 全部路由均已鉴权"

  # E2E 测试（独立 job，可并行，失败不阻塞主流程）
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: 调试工作目录
        run: |
          pwd
          ls -la
          ls -la package.json pnpm-lock.yaml

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: pnpm install

      - name: 安装 Playwright 浏览器（全部）
        run: pnpm exec playwright install --with-deps

      - name: 启动开发服务器
        run: |
          pnpm dev > dev.log 2>&1 &
          DEV_PID=$!
          echo "Dev server PID: $DEV_PID"
          # 等待并重试检查服务器是否就绪
          for i in {1..60}; do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Dev server ready after $i attempts"
              break
            fi
            if ! kill -0 $DEV_PID 2>/dev/null; then
              echo "Dev server process died!"
              cat dev.log
              exit 1
            fi
            sleep 2
          done
          # 最后确认
          curl -f http://localhost:3000 || (cat dev.log && exit 1)

      - name: 运行 E2E 测试（仅核心认证流程）
        run: pnpm e2e --project=chromium tests/e2e/auth.spec.ts --timeout=120000
        env:
          E2E_BASE_URL: http://localhost:3000

      - name: 上传 E2E 失败截图/视频
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/

  # 视觉回归测试（失败不阻塞，仅在本地生成基线）
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: 调试工作目录
        run: |
          pwd
          ls -la
          ls -la package.json pnpm-lock.yaml

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: pnpm install

      - name: 安装 Playwright 浏览器（全部）
        run: pnpm exec playwright install --with-deps

      - name: 启动开发服务器
        run: |
          pnpm dev > dev.log 2>&1 &
          DEV_PID=$!
          echo "Dev server PID: $DEV_PID"
          # 等待并重试检查服务器是否就绪
          for i in {1..60}; do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Dev server ready after $i attempts"
              break
            fi
            if ! kill -0 $DEV_PID 2>/dev/null; then
              echo "Dev server process died!"
              cat dev.log
              exit 1
            fi
            sleep 2
          done
          # 最后确认
          curl -f http://localhost:3000 || (cat dev.log && exit 1)

      - name: 生成视觉基线（首次运行）
        run: pnpm e2e --project=chromium tests/e2e/visual.spec.ts --update-snapshots --timeout=120000
        env:
          E2E_BASE_URL: http://localhost:3000
        continue-on-error: true

      - name: 上传视觉差异报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: test-results/

  # Storybook 构建验证（失败不阻塞）
  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: 调试工作目录
        run: |
          pwd
          ls -la
          ls -la package.json pnpm-lock.yaml

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: pnpm install

      - name: 构建 Storybook
        run: pnpm build-storybook
        timeout-minutes: 25

      - name: 上传 Storybook 产物
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static/
