name: CI

# 类型安全守门：next.config.mjs 里为兼容 NAS 自托管构建设了
# typescript.ignoreBuildErrors / eslint.ignoreDuringBuilds，
# 因此构建不会因类型错误而失败——改由 CI 显式校验，避免「能构建但不能跑」的回归。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci --omit=optional

      - name: TypeScript 类型检查
        run: npx tsc --noEmit --skipLibCheck

      - name: 单元测试（castle 核心逻辑等）
        run: npx vitest run

      - name: ESLint 代码检测
        run: npm run lint

      - name: 生产构建冒烟（next build）
        run: npm run build

      - name: API 路由鉴权自动检查
        run: |
          ALLOWED_MISSING=(
            'auth/login'
            'auth/logout'
            'cron/backup'
            'cron/settle'
            'media/[...path]'
            'tts'
            'tts-edge'
            'tts-debug'
          )
          FAIL=0
          while IFS= read -r f; do
            rel="${f#src/app/api/}"
            rel="${rel%/route.ts}"
            skip=0
            for a in "${ALLOWED_MISSING[@]}"; do [ "$rel" = "$a" ] && { skip=1; break; }; done
            [ "$skip" = 1 ] && continue
            if ! grep -q 'getCurrentUser' "$f" 2>/dev/null; then
              echo "❌ 缺少鉴权: $rel"
              FAIL=1
            fi
          done < <(find src/app/api -name 'route.ts' | sort)
          if [ "$FAIL" = 1 ]; then echo "---"; echo "新增路由必须调用 getCurrentUser()；已知公开路由请加入 ALLOWED_MISSING 白名单。"; exit 1; fi
          echo "✅ 全部路由均已鉴权"
