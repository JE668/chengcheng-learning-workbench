name: CI

# 类型安全守门：next.config.mjs 里为兼容 NAS 自托管构建设了
# typescript.ignoreBuildErrors / eslint.ignoreDuringBuilds，
# 因此构建不会因类型错误而失败——改由 CI 显式校验，避免「能构建但不能跑」的回归。
on:
  # 注意：这里**故意不监听** push: main。
  # build.yml 的 precheck 已经 `uses:` 复用了本 workflow，push 到 main 时
  # 会执行同一套检查；若这里也监听 push，每次 push 会完整跑两遍（白花约 4 分钟）。
  # 保留 pull_request 是为了将来走 PR 流程时仍有独立 CI 信号。
  pull_request:
  # 供 build.yml 通过 `uses:` 复用调用；缺此项时 GitHub 会拒绝实例化
  # precheck job，导致整个 build run 0 jobs 直接失败。
  workflow_call:

# 本 workflow 被 build.yml 以 `uses:` 复用调用，因此 concurrency group 必须同时
# 区分「谁在调用」。关键点：
#   - github.event_name 在嵌套调用中继承父事件（仍为 "push"），无法区分来源，
#     用它会再次撞车。
#   - github.workflow 在嵌套调用中取调用方名字（"Build and Push Image"），可区分。
#   - 必须加 "CI-" 前缀：否则嵌套 run 的 group 会变成
#     "Build and Push Image-refs/heads/main"，与 build.yml 自身的 group 完全相同，
#     cancel-in-progress 会让 build.yml 与它自己的 precheck 互相取消。
#
# 最终三条线互不干扰：
#   CI push 独立运行      -> CI-CI-refs/heads/main
#   ci.yml 被 build 调用  -> CI-Build and Push Image-refs/heads/main
#   build.yml 自身        -> Build and Push Image-refs/heads/main
concurrency:
  group: CI-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 调试工作目录
        run: |
          pwd
          ls -la
          ls -la package.json pnpm-lock.yaml

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v6
        name: Cache pnpm store
        id: pnpm-store-cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - uses: actions/cache@v6
        name: Cache node_modules
        id: node-modules-cache
        with:
          path: |
            **/node_modules
            .next/cache
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: TypeScript 类型检查（主代码库）
        run: npx tsc --noEmit --skipLibCheck -p tsconfig.json

      - name: 单元测试 + 覆盖率
        run: pnpm test:coverage

      - name: ESLint 代码检测
        run: pnpm lint

      - name: 媒体登记一致性（课本 PDF / 封面图是否存在）
        run: pnpm check-media

      - name: 生成物与源一致（萌可图鉴）
        run: |
          node scripts/gen-moko-collection.cjs
          git diff --exit-code src/lib/moko-collection/ >/dev/null || {
            echo '❌ src/lib/moko-collection 与生成器输出不一致，请本地跑 node scripts/gen-moko-collection.cjs 后提交';
            exit 1;
          }
          echo '✅ moko-collection 与生成器输出一致'

      - name: 生产构建冒烟（next build）
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: 性能预算检查
        run: |
          # 检查 JS bundle 大小不超过预算
          # 实际 First Load JS 约 87KB，但 .next/static/chunks 总计约 4MB（含动态导入）
          # 预算设为 5000KB 防止失控增长，同时允许正常的代码分割
          BUDGET_KB=5000
          # 修正：使用 ls -l 获取文件大小，兼容 macOS 和 Linux
          ACTUAL_KB=$(find .next/static/chunks -name "*.js" -type f -exec ls -l {} + 2>/dev/null | awk '{sum+=$5} END {print int(sum/1024)}')
          echo "Total client chunks: ${ACTUAL_KB}KB (budget: ${BUDGET_KB}KB)"
          if [ "$ACTUAL_KB" -gt "$BUDGET_KB" ]; then
            echo "❌ Bundle size exceeds budget!"
            exit 1
          fi
          echo "✅ Bundle size within budget"

      - name: API 路由鉴权自动检查
        run: |
          ALLOWED_MISSING=(
            'auth/login'
            'auth/logout'
            'cron/backup'
            'cron/settle'
            'media/[...path]'
            'tts'
            'tts-edge'
            'tts-debug'
            'tts/health'
          )
          FAIL=0
          while IFS= read -r f; do
            rel="${f#src/app/api/}"
            rel="${rel%/route.ts}"
            skip=0
            for a in "${ALLOWED_MISSING[@]}"; do [ "$rel" = "$a" ] && { skip=1; break; }; done
            [ "$skip" = 1 ] && continue
            if ! grep -q 'getCurrentUser' "$f" 2>/dev/null; then
              echo "❌ 缺少鉴权: $rel"
              FAIL=1
            fi
          done < <(find src/app/api -name 'route.ts' | sort)
          if [ "$FAIL" = 1 ]; then echo "---"; echo "新增路由必须调用 getCurrentUser()；已知公开路由请加入 ALLOWED_MISSING 白名单。"; exit 1; fi
          echo "✅ 全部路由均已鉴权"

      - name: 依赖安全扫描
        run: |
          # 依赖安全门禁：阻断 high/critical 漏洞
          # 使用官方 registry（npmmirror 不支持 audit endpoint）
          pnpm audit --json --registry=https://registry.npmjs.org > audit-report.json || true

          # Next.js 14.x 分支的已知豁免：14.x 存在 8 个 high 级 advisory，
          # 补丁仅在 15.5.15~15.5.21 发布，14.x 没有任何可用修复版本。
          # 影响面评估：SSRF 类需攻击者控制 Host 头，项目以 `next start` 部署
          # （Host 由 next 自身固定）实际不可达；DoS 类需构造 RSC 序列化请求。
          # 升级到 Next.js 15 需同步 React 18→19，属独立任务另行评估。
          # 判定逻辑集中在 scripts/check-audit.mjs（Node 实现，不再依赖 runner 上的 jq）：
          #   · fail-closed —— 报告缺失/解析失败/结构变化一律判失败（原 jq 版是 fail-open）
          #   · 已知豁免集中管理，且每条附「为什么没有修复版本」与「何时重新评估」
          # 本地复现（与 CI 完全相同）：
          #   pnpm audit --json --registry=https://registry.npmjs.org > /tmp/a.json
          #   node scripts/check-audit.mjs /tmp/a.json
          node scripts/check-audit.mjs audit-report.json

      - name: 上传安全扫描报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: audit-report.json

  # E2E 结果汇流：让 build.yml 的 `needs: precheck` 真正包含 e2e 的成败。
  #
  # 背景：build.yml 以 `uses:` 复用本 workflow，而**被复用 workflow 对外只暴露
  # 整个 workflow 的结果**（等价于单个 job），build.yml 无法写 `needs: [precheck, e2e]`
  # 引用内部 job。于是原先 `e2e` 即使全红，precheck 依然是绿的 → 照样推镜像到 GHCR。
  #
  # 这里加一个汇总 job：needs [check, e2e]，条件是 `if: always()`（否则上游失败时
  # 它会被跳过，绿灯假象），再显式检查两个上游的结果并在上游有失败时 exit 1。
  # 这样 precheck 变红 → build 不再触发。
  e2e-gate:
    if: always()
    needs: [check, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: 汇总门禁：check 与 e2e 都必须通过
        run: |
          echo "check = ${{ needs.check.result }}"
          echo "e2e   = ${{ needs.e2e.result }}"
          if [ "${{ needs.check.result }}" != "success" ] || [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "❌ 门禁未通过：check=${{ needs.check.result }} e2e=${{ needs.e2e.result }}"
            echo "   单元测试/类型检查/ESLint 或 E2E 有失败，拒绝构建并推送镜像。"
            exit 1
          fi
          echo "✅ check 与 e2e 均通过"

  # E2E 测试（独立 job，可与 check 并行，但**失败必须阻塞镜像构建**）
  #
  # ⚠️ 原先这里带 `continue-on-error: true` 且只点名 3 个 spec，
  # 导致 learning.spec.ts / parent.spec.ts（11 个用例）永不执行，
  # 且 E2E 全红也照样推镜像到 GHCR —— 等于没有门禁。现已去掉并跑全部 spec。
  #
  # ⚠️ timeout 从 45 提到 75 分钟：实测 45 分钟会在「安装 Playwright 浏览器」
  # 那一步就超时（17:50 开始、18:35 被 cancel，一个用例都没跑），
  # 而浏览器下载速度受 CI 网络影响很大。上面的 Playwright 浏览器缓存能显著缓解，
  # 但仍需为慢速网络留余量 —— 45 分钟把「下载慢」误判成了「测试失败」。
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - name: 调试工作目录
        run: |
          pwd
          ls -la
          ls -la package.json pnpm-lock.yaml

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v6
        name: Cache pnpm store
        id: pnpm-store-cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - uses: actions/cache@v6
        name: Cache node_modules
        id: node-modules-cache
        with:
          path: |
            **/node_modules
            .next/cache
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - uses: actions/cache@v6
        name: Cache Playwright browsers
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 初始化测试数据库（seed 默认账号，local.db 被 gitignore 未入库）
        run: pnpm seed

      - name: 安装 Playwright 浏览器（chromium）
        # 单独设 timeout：浏览器下载受 CI 网络影响很大，曾把整个 job 拖到超时
        # （2026-10-07 那次 45 分钟里全耗在这一步，一个用例都没跑）。
        # 这里给 20 分钟独立预算：超时了就明确报「浏览器装不上」而不是
        # 让 job 被外层 timeout 静默 cancel，那样看不出到底卡在哪。
        timeout-minutes: 20
        run: pnpm exec playwright install --with-deps chromium

      - name: 校验 chromium 可用
        run: |
          node -e "const {chromium}=require('@playwright/test');chromium.launch().then(async b=>{await b.close();console.log('✅ chromium 启动正常')}).catch(e=>{console.error('❌ chromium 无法启动:',e.message);process.exit(1)})"

      - name: 启动开发服务器
        env:
          # e2e 有 23 次登录尝试，默认限流 5 分钟 10 次会导致后半段测试全部 429。
          # 测试环境放宽：1 小时 100 次（仅影响本测试 run 的 dev server 进程）。
          # 账号级锁定：5 次失败锁 15 分钟，测试中多次登录同一账号可能误触（parent 在 auth 和 business-flows 各登录 1 次）。
          LOGIN_RATE_LIMIT_WINDOW: '3600'
          LOGIN_RATE_LIMIT_MAX: '100'
          MAX_LOGIN_FAILS: '100'
          LOGIN_LOCK_SECONDS: '0'
        run: |
          pnpm dev > dev.log 2>&1 &
          DEV_PID=$!
          echo "Dev server PID: $DEV_PID"
          # 等待并重试检查服务器是否就绪
          for i in {1..60}; do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Dev server ready after $i attempts"
              break
            fi
            if ! kill -0 $DEV_PID 2>/dev/null; then
              echo "Dev server process died!"
              cat dev.log
              exit 1
            fi
            sleep 2
          done
          # 最后确认
          curl -f http://localhost:3000 || (cat dev.log && exit 1)

      - name: 运行 E2E 测试（跑全部 spec，不再点名子集）
        # 不再只点名 3 个文件：learning/parent 两个 spec 此前从未在 CI 里跑过。
        # --project=chromium 是因为 CI 只安装 chromium（playwright.config.ts 里另有
        # firefox/webkit/Mobile 项目，声明了但 CI 不执行）。
        run: pnpm e2e --project=chromium --timeout=180000
        env:
          E2E_BASE_URL: http://localhost:3000

      - name: 上传 E2E 失败截图/视频
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/

      # ⚠️ 开发服务器日志必须上传 —— 这是排查 e2e 服务端故障的唯一线索。
      # dev server 是 `pnpm dev > dev.log 2>&1 &`，它的 stdout/stderr **不在** job 日志里；
      # 没有这个 artifact 时，页面只表现成「接口 500」，看不到任何堆栈。
      # 之前几次 CI 红（每日一练 /api/daily-practice 500）就卡在这里。
      # 用 always() 而非 failure()：flaky 用例「先失败后重试通过」时整体是绿的，
      # 但那次失败的服务端报错恰恰最值得看。
      - name: 上传开发服务器日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dev-server-log
          path: dev.log
          if-no-files-found: warn
