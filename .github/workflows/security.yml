name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Run daily at 03:00 UTC to catch new vulnerabilities
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write  # for codeql upload
  actions: read  # for checking workflow runs

jobs:
  # npm audit - fast, built-in
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        name: Cache pnpm store
        id: pnpm-store-cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - uses: actions/cache@v4
        name: Cache node_modules
        id: node-modules-cache
        with:
          path: |
            **/node_modules
            .next/cache
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Run npm audit
        run: |
          # Use official npm registry for audit (npmmirror doesn't support audit endpoint)
          pnpm audit --json --registry=https://registry.npmjs.org > audit-report.json || true

          # Next.js 14.x 已知豁免：14.x 有 8 个 high advisory，补丁仅在 15.5.15~15.5.21
          # 发布，14.x 无任何可用修复版本。评估结论与豁免理由见 ci.yml 同名步骤。
          ACCEPTED_NEXT=$(cat audit-report.json | jq '[.advisories[] | select(.severity=="high" or .severity=="critical") | select(.module_name=="next")] | length')
          ACTIONABLE=$(cat audit-report.json | jq '[.advisories[] | select(.severity=="high" or .severity=="critical") | select(.module_name!="next")] | length')
          echo "high/critical 漏洞：待修复 $ACTIONABLE 个，next 已知豁免 $ACCEPTED_NEXT 个"

          if [ "$ACTIONABLE" -gt 0 ]; then
            echo "❌ Found $ACTIONABLE high/critical vulnerabilities (excl. accepted next advisories)"
            cat audit-report.json | jq '.advisories[] | select(.severity=="high" or .severity=="critical") | select(.module_name!="next") | {title: .title, severity: .severity, module: .module_name, url: .url}'
            exit 1
          else
            echo "✅ No actionable high/critical vulnerabilities"
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: audit-report.json

  # OWASP Dependency Check - more comprehensive
  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download and run OWASP Dependency Check
        shell: bash
        run: |
          wget -q https://github.com/dependency-check/DependencyCheck/releases/download/v12.2.2/dependency-check-12.2.2-release.zip
          unzip -q dependency-check-12.2.2-release.zip
          chmod +x ./dependency-check/bin/dependency-check.sh
          ./dependency-check/bin/dependency-check.sh \
            --project "chengcheng-learning-workbench" \
            --scan . \
            --format JSON \
            --out dependency-check-report \
            --failOnCVSS 7 \
            --suppression suppression.xml \
            --enableExperimental \
            --enableRetired

      - name: Upload dependency check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report/

  # CodeQL Analysis (GitHub's built-in SAST)
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript, typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"

  # Snyk (optional - requires SNYK_TOKEN secret)
  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      # job 级 if 只允许 github/inputs/needs/vars 四个 context，
      # secrets 与 env 都在 job 级不可用（actionlint: context is not allowed here），
      # 会导致整个 workflow 校验失败、0 job 创建。
      # 改用 step 级 gate：无 token 时 gate 不产出 enabled，后续所有步骤因条件不满足而跳过。
      - name: Gate - require SNYK_TOKEN
        id: gate
        if: ${{ env.SNYK_TOKEN != '' }}
        run: echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Run Snyk test
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        uses: snyk/actions/node@master
        with:
          command: test
          args: --severity-threshold=high --json-file-output=snyk-report.json

      - name: Upload Snyk report
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: snyk-report.json