name: Build and Push Image

# 在 GitHub 上把应用编译成 Docker 镜像并推送到 GHCR。
# 飞牛端只需 `docker pull` 该镜像 + 挂载本地媒体，无需源码、无需编译。
# 触发：push 到 main 时自动构建；也可在 Actions 页手动 `workflow_dispatch` 触发。
#
# 推送目标：
#   1) ghcr.io/je668/...   —— 用内置 GITHUB_TOKEN，零配置，必成功（主推送）
#   2) ghcr.nju.edu.cn/je668/... —— 南大镜像加速站。在仓库 Settings → Secrets 配置
#      GHCR_NJU_TOKEN（南大站的推送 token）后，下面两步会成功把镜像同步过去；
#      未配置时这两步自动失败并被 continue-on-error 兜住，不影响 ghcr.io 主推送。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # 说明：仓库里 public/raz、public/textbooks（约 502MB 媒体）由项目根 .dockerignore 排除，
        # 不会进入构建上下文、也不会进镜像。镜像只包含应用本体，媒体由飞牛挂载提供。

      - name: Log in to GHCR ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Docker 镜像 tag 必须全小写；GitHub 仓库名 JE668/... 含大写，需转小写
      # 否则报 "repository name must be lowercase"，构建在 tag 校验阶段即失败。
      - name: Lowercase image name
        run: echo "IMAGE_IO=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"; echo "IMAGE_NJU=ghcr.nju.edu.cn/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # 主推送：ghcr.io（用内置 GITHUB_TOKEN，零额外配置，必成功）
      - name: Build and push to ghcr.io
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64        # 飞牛多为 x86-64；若你的设备是 ARM 需改为 linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_IO }}:latest
            ${{ env.IMAGE_IO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 同步到南大镜像加速站（ghcr.nju.edu.cn）：仓库 Settings → Secrets 配置 GHCR_NJU_TOKEN 后生效。
      # 未配置时下面两步失败但被 continue-on-error 兜住，不影响 ghcr.io 主推送。
      - name: Login to NJU mirror
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.nju.edu.cn
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_NJU_TOKEN }}

      - name: Push to NJU mirror
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NJU }}:latest
            ${{ env.IMAGE_NJU }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
