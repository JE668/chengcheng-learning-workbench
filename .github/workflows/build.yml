name: Build and Push Image

# 在 GitHub 上把应用编译成 Docker 镜像并推送到 GHCR。
# 飞牛端只需 `docker pull` 该镜像 + 挂载本地媒体，无需源码、无需编译。
# 触发：push 到 main 时自动构建；也可在 Actions 页手动 `workflow_dispatch` 触发。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # 说明：仓库里 public/raz、public/textbooks（约 502MB 媒体）由项目根 .dockerignore 排除，
        # 不会进入构建上下文、也不会进镜像。镜像只包含应用本体，媒体由飞牛挂载提供。

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64        # 飞牛多为 x86-64；若你的设备是 ARM 需改为 linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
