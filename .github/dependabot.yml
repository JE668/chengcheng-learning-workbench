# Dependabot 配置
# 自动创建 PR 更新依赖，按类型分组减少 PR 数量
# 查看 PR：GitHub → 仓库 → Pull requests → dependabot 标签

version: 2
updates:
  # npm 依赖（生产 + 开发）
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Shanghai"
    # 分组策略：按类型合并 PR，避免刷屏
    groups:
      # 开发依赖：测试、构建、lint 工具等
      dev-dependencies:
        patterns:
          - "@commitlint/*"
          - "@next/*"
          - "@playwright/*"
          - "@testing-library/*"
          - "@types/*"
          - "@vitest/*"
          - "autoprefixer"
          - "eslint*"
          - "husky"
          - "jsdom"
          - "kysely-codegen"
          - "lint-staged"
          - "postcss"
          - "prettier"
          - "tailwindcss"
          - "typescript"
          - "vitest"
        update-types:
          - "minor"
          - "patch"
      # 生产依赖：核心运行时库
      production-dependencies:
        patterns:
          - "@libsql/*"
          - "@tanstack/*"
          - "bcryptjs"
          - "clsx"
          - "hanzi-writer"
          - "kysely"
          - "lucide-react"
          - "next"
          - "pdfjs-dist"
          - "react"
          - "react-dom"
          - "tailwind-merge"
          - "ws"
          - "zod"
          - "zustand"
        update-types:
          - "minor"
          - "patch"
      # Sentry 单独分组（重要监控库）
      sentry:
        patterns:
          - "@sentry/*"
        update-types:
          - "minor"
          - "patch"
    # 忽略 major 版本（破坏性变更需人工评估）
    ignore:
      - dependency-type: "all"
        update-type: "version-update:semver-major"
    # 标签便于筛选
    labels:
      - "dependencies"
      - "npm"
    # 每次最多 5 个 PR，避免一次性太多
    open-pull-requests-limit: 5
    # 允许自动合并 patch 版本（需配合 branch protection + status checks）
    # allow:
    #   - dependency-type: "all"
    #     update-type: "version-update:semver-patch"

  # GitHub Actions 依赖
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:30"
      timezone: "Asia/Shanghai"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 3

  # Docker 基础镜像
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Shanghai"
    groups:
      docker-base-images:
        patterns:
          - "node*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 2

  # pip (如果有 Python 依赖，如 edge-tts)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:30"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
      - "pip"
    open-pull-requests-limit: 2