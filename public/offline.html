<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>离线模式 - 程程学习工作台</title>
  <meta name="theme-color" content="#a855f7">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Noto Sans SC", "Inter", system-ui, sans-serif;
      background: linear-gradient(135deg, #fefaf7 0%, #fff8f0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      max-width: 400px;
      width: 100%;
      text-align: center;
      padding: 2rem;
      background: white;
      border-radius: 2rem;
      box-shadow: 0 20px 40px -14px rgba(168, 85, 247, 0.28);
      border: 2px solid #ffafc9;
    }
    .emoji { font-size: 4rem; margin-bottom: 1rem; animation: bounce 2s ease-in-out infinite; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    h1 { color: #a855f7; font-size: 1.75rem; font-weight: 900; margin-bottom: 0.75rem; }
    p { color: #6b7280; line-height: 1.6; margin-bottom: 1.5rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.875rem 1.75rem;
      border-radius: 9999px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #f472b6 0%, #ec4899 100%);
      color: white;
      box-shadow: 0 4px 14px -4px rgba(244, 114, 182, 0.4);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px -4px rgba(244, 114, 182, 0.5); }
    .btn-primary:active { transform: scale(0.98); }
    .tips { margin-top: 1.5rem; padding: 1rem; background: #fef3e2; border-radius: 1rem; font-size: 0.875rem; color: #92400e; }
    .tip-item { display: flex; align-items: center; gap: 0.5rem; margin: 0.5rem 0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">📴</div>
    <h1>暂时离线了</h1>
    <p>网络似乎开小差了，但别担心！你的学习进度和数据都在本地安全保存着。</p>
    <button class="btn btn-primary" onclick="window.location.reload()">🔄 重新连接</button>
    <div class="tips">
      <div class="tip-item">📚 已完成的学习进度已本地保存</div>
      <div class="tip-item">🏰 城堡数据会在联网后自动同步</div>
      <div class="tip-item">📝 离线期间的操作会在联网后同步</div>
    </div>
  </div>
  <script>
    // 监听在线状态，自动刷新
    window.addEventListener('online', () => window.location.reload());
    // 定期尝试重新连接
    setInterval(() => { if (navigator.onLine) window.location.reload(); }, 30000);
  </script>
</body>
</html>
