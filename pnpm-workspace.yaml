allowBuilds:
  core-js-pure: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  # pnpm 12 把「未登记的构建脚本」从警告升级为安装失败（ERR_PNPM_IGNORED_BUILDS），
  # 所以新依赖必须显式表态。sentry-cli 的 postinstall 只下载用于上传 source map 的
  # 原生 CLI，本项目 CI 与镜像都不上传 source map（不设置 SENTRY_AUTH_TOKEN），
  # 故显式记为 false（不允许构建），而不是留在隐式忽略里——显式才能离线复现。
  '@sentry/cli': false

# 依赖覆盖：**本文件是唯一来源**，不要再往 package.json 的 pnpm.overrides 里加。
#
# ## 为什么强调「唯一来源」（2026-11-07）
# 历史上两处同时存在，而语义是**互相覆盖而不是合并**：
#   pnpm 10.12.1 读 package.json 的 5 条，把本文件的 14 条整块忽略
#   （证据：HEAD 的 pnpm-lock.yaml `overrides:` 段恰好只有那 5 条）。
#   升级到 pnpm 12 并删掉 package.json 那 5 条后，本文件这 14 条第一次真正生效，
#   于是把 9306227「patch remaining dependabot alerts」刚修好的两条打了回去：
#     glob      14.0.3 → 10.5.0（GHSA-3g3m-2fjr-6pw4，patched >=14.0.2）
#     minimatch 11.0.4 → 10.x  （GHSA-g3hv-75wg-m249，glob 的传递依赖，随之复发）
#   两条都是 moderate，而 check-audit.mjs 只阻断 high/critical，**CI 不会拦**，
#   所以只能靠下面的注释 + 改完必跑 audit 来兜。
#
# ## 维护规则
#   1. 只在这里改；两处并存 = 静默回退。
#   2. 改完必须跑 `pnpm install` 且
#      `pnpm audit --json --registry=https://registry.npmjs.org`（与 ci.yml 同命令），
#      确认没把已修的 advisory 版本改小。
#   3. 每条钉版都要写清钉到哪个版本、为什么；没理由的钉版一律删掉。
# postcss-selector-parser < 7.1.6 有二次复杂度 CPU 耗尽漏洞（dependabot #52，
# moderate，构建期工具链的传递依赖，不进运行时）。
overrides:
  postcss-selector-parser: ^7.1.6
  postcss: 8.5.26
  dot-prop: 5.3.0
  # glob >=14.0.2：GHSA-3g3m-2fjr-6pw4（@sentry/nextjs>@sentry/bundler-plugins>glob）。
  # 不要退回 10.x —— 那正是 2026-11-07 那次静默回退的起点。
  glob: ^14.0.2
  # vite >=6.4.5：GHSA-587h-7wmj-h5pm（launch-editor）。与 package.json devDependencies 对齐。
  vite: ^6.4.5
  js-yaml: 4.3.2
  fast-uri: ^3.1.9
  undici: ^7.30.1
  brace-expansion@1: ^1.1.20
  brace-expansion@2: ^2.1.6
  brace-expansion@5: ^5.0.11
  # minimatch >=11.0.1：GHSA-g3hv-75wg-m249（globparts 放大导致的 CPU DoS，moderate）。
  # 命中的是两条**构建期**链路，不进运行时：
  #   10.2.6 ← @typescript-eslint/typescript-estree（eslint）
  #   9.0.9  ← fast-glob（tailwind content 扫描 / eslint 忽略规则）
  # 按大版本范围分别覆盖（与上面 brace-expansion@N 同一手法），
  # 不要裸写 minimatch: —— 那会把 eslint 依赖的 minimatch@3 一起顶到 v11，
  # 而 eslint 用的是 v3 的 API，等于直接把 lint 弄坏。
  minimatch@9: ^11.0.5
  minimatch@10: ^11.0.5
  tinypool: ^2.2.0
  source-map-js: ^1.2.2
  yaml: ^2.8.3
